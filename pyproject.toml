[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "busbar-runtime"
version = "0.3.0"
description = "A context-reuse decision runtime for LLM agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "pydantic>=2.12,<3",
  "fastapi>=0.135,<1",
  "uvicorn>=0.40,<1",
  "transformers==5.17.0",
  "huggingface-hub>=1.0,<2",
]

[project.optional-dependencies]
mlx = ["mlx-lm @ git+https://github.com/ml-explore/mlx-lm.git@a63e24c389382619eb6d9af656e3b46024be217a ; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]
hf = ["torch==2.10.0"]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.16,<0.17"]

[project.scripts]
busbar = "busbar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/busbar"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires the actual pinned checkpoint and accelerator dependencies"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
